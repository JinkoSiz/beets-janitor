# Рабочий пример. Скопировать в docker-compose.yml, поправить пути слева
# от двоеточия и заполнить .env.
#
# Два контейнера:
#
#   beets  — сторож: импортирует появившееся в incoming и раз в сутки
#            прогоняет библиотеку через цепочку починки. Единственный, кто
#            пишет в фонотеку и в базу beets.
#   panel  — пульт: решения, новинки, дискография, карантин, журнал. Сам
#            ничего в фонотеке не трогает — кладёт действие в очередь, а
#            выполняет его сторож.
#
# Для сторожа образ берём готовый — linuxserver/beets: в нём уже лежат beets,
# ffmpeg и fpcalc из chromaprint. Штатный entrypoint образа поднимает
# веб-интерфейс beets; нам он не нужен, поэтому entrypoint подменён.


services:
  beets:
    image: lscr.io/linuxserver/beets:latest
    container_name: beets
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c", "python3 /app/scripts/render-config.py && exec /bin/sh /app/scripts/nightly.sh"]
    env_file: .env
    environment:
      TZ: Europe/Moscow
      # beets ищет конфиг по BEETSDIR — скрипты зовут просто `beet`
      BEETSDIR: /config
      # sitecustomize.py подхватывается интерпретатором только через PYTHONPATH:
      # он придерживает темп обращений к Spotify и кэширует ответы
      PYTHONPATH: /app/scripts
      # в образе linuxserver fpcalc лежит здесь
      FPCALC: /usr/bin/fpcalc
      # права на файлы фонотеки после работы; убрать, если не нужно
      OWNER: "1000:1000"
    volumes:
      # сам набор скриптов: репозиторий целиком, только на чтение
      - ./:/app:ro
      # конфиги, база beets, журналы; внутри — папка janitor/ с общей базой набора
      - ./data/config:/config
      # фонотека
      - /srv/media/music:/music
      # куда падают новые файлы
      - /srv/media/incoming:/incoming
      # карантин: убранные копии и битые файлы
      - /srv/media/residue:/residue

  panel:
    build:
      context: .
      dockerfile: panel/Dockerfile
    container_name: beets-panel
    restart: unless-stopped
    env_file: .env
    environment:
      TZ: Europe/Moscow
    ports:
      # наружу — через обратный прокси с HTTPS (Nginx Proxy Manager и т.п.);
      # без него держите пульт только в локальной сети
      - "127.0.0.1:8090:8000"
    volumes:
      # конфиги и база beets — только на чтение: пульт их читает, но не пишет
      - ./data/config:/config:ro
      # кроме своей папки: общая база набора, загрузки обложек и файлов на замену
      - ./data/config/janitor:/config/janitor
      # фонотека и карантин — только на чтение, чтобы слушать файлы в карточках
      - /srv/media/music:/music:ro
      - /srv/media/residue:/residue:ro

# Скачивание новинок и дискографий идёт через downtify
# (github.com/henriquesebastiao/downtify): укажите его адрес в DOWNTIFY_URL,
# а папку, куда он качает, сделайте той же, что incoming у сторожа. Без
# downtify пульт работает, просто кнопка «Скачать» ставит задания впустую.
#
# Если ходите в интернет через прокси (MusicBrainz и Spotify бывают недоступны
# напрямую), добавьте в environment:
#   HTTP_PROXY: http://proxy:1081
#   HTTPS_PROXY: http://proxy:1081
#   NO_PROXY: localhost,127.0.0.1,downtify
